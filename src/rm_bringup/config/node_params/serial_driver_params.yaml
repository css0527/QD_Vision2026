/**:
  ros__parameters:
    target_frame: odom
    child_frame_id: gimbal_link
    timestamp_offset: 0.000
    port_name: "/dev/ttyACM0"
    baud_rate: 115200  # 波特率 921600, 115200, 19200, 9600, 4800, 2400, 1200, 300
    protocol: "hero"  # hero、air、infantry、sentry 均使用 Seasky 浮点帧
    crc_profile: "crc8_31_modbus"  # 与实板抓包一致；旧样例可选 robomaster
    pitch_horizontal_rad: 0.58 # 云台水平时电控的绝对 pitch
    pitch_up_sign: -1.0 # 向上抬头时电控 pitch 减小
    pitch_min_rad: 0.4 # 抬头极限
    pitch_max_rad: 0.75 # 低头极限
    follow:
      enabled: true
      time_constant_s: 0.18 # 目标低通时间常数，越大跟随越柔和
      pitch_rate_deg_s: 12.0 # 电机绝对目标 pitch 最大变化速度（度/秒）
      pitch_deadband_deg: 0.25 # 静止目标微幅观测抖动不再驱动上下换向，回水平不使用死区
      yaw_rate_deg_s: 60.0 # 电机绝对目标 yaw 最大变化速度（度/秒）
      feedback_timeout_s: 0.30 # 实测反馈过期后停发，重捕从新反馈起步
    idle_return:
      enabled: true # 启动及丢失目标后平滑回水平，保持当前 yaw
      command_timeout_s: 0.15 # 短时丢帧先保持，超时后回水平，减少重捕点头
    enable_data_print: true # 每秒打印一次接收姿态和实际写出的角度
